syntax = "proto3";

package plugin.v1;

option go_package = "0kay/gen/plugin/v1;pluginv1";
option java_package = "ai.zero.kay.plugin.v1";
option java_multiple_files = true;
option csharp_namespace = "Zero.Kay.Plugin.V1";
option objc_class_prefix = "ZKPlugin";

// PluginInfo contains metadata about a plugin.
message PluginInfo {
  // name is the human-readable name of the plugin.
  string name = 1;

  // version is the semantic version (e.g., "1.0.0").
  string version = 2;

  // description is a brief description of the plugin's functionality.
  string description = 3;

  // author is the plugin author's name or identifier.
  string author = 4;

  // plugin_type categorizes the plugin.
  PluginType plugin_type = 5;

  // permissions declares the APIs the plugin needs/exposes and the outbound
  // network it requires. Core enforces these: an API call not listed in
  // api_requires is rejected, and egress not listed in `egress` is blocked.
  // Built-in plugins are exempt (full access).
  PluginPermission permissions = 6;

  // tools lists tool descriptors this plugin contributes to Agent and/or
  // L.I.F.E. Core publishes them in its tool catalog; calls are routed back to
  // the plugin's ToolService.
  repeated PluginTool tools = 7;
}

// PluginTool is a tool a plugin contributes to Agent / L.I.F.E.
message PluginTool {
  // name is the globally unique tool name shown to the model.
  string name = 1;

  // description explains what the tool does.
  string description = 2;

  // parameters_json is a JSON Schema object for the tool arguments.
  string parameters_json = 3;

  // dangerous marks a tool that mutates the host or is otherwise privileged.
  bool dangerous = 4;

  // scopes lists the consumers allowed to use it ("agent", "life").
  repeated string scopes = 5;
}

// ToolService is implemented by plugins that contribute tools.
service ToolService {
  // CallTool executes one of the plugin's declared tools.
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}

// CallToolRequest is the request for ToolService.CallTool.
message CallToolRequest {
  // caller_id is the consumer invoking the tool ("agent", "life", ...).
  string caller_id = 1;

  // tool is the tool name.
  string tool = 2;

  // args_json is the JSON-encoded arguments object.
  string args_json = 3;

  // session_id groups the call into a conversation session.
  string session_id = 4;
}

// CallToolResponse is the response for ToolService.CallTool.
message CallToolResponse {
  // success indicates the tool ran without error.
  bool success = 1;

  // result is a JSON-encoded result payload.
  string result = 2;

  // error is a human-readable error when success is false.
  string error = 3;
}

// PluginPermission is a plugin's declared permission set, mirrored from its
// package manifest (`permissions`) at registration time.
message PluginPermission {
  // api_requires lists the Core APIs the plugin may call, as
  // "METHOD /path" (e.g. "GET /api/providers/credentials") or a gRPC method
  // (e.g. "core.v1.CoreService/CallMocr"). A trailing "*" matches a prefix.
  repeated string api_requires = 1;

  // api_exposes lists the APIs this plugin exposes to Core and other plugins,
  // using the same notation (e.g. "agent.v1.AgentService/ExecuteTask").
  repeated string api_exposes = 2;

  // egress lists the hosts the plugin may reach through Core's egress proxy,
  // as a hostname, "host:port" or IP (e.g. "api.open-meteo.com"). A leading
  // "*." matches any subdomain.
  repeated string egress = 3;
}

// PluginType categorizes the plugin's role in the system.
enum PluginType {
  // PLUGIN_TYPE_UNSPECIFIED is the default value.
  PLUGIN_TYPE_UNSPECIFIED = 0;

  // PLUGIN_TYPE_ADAPTER is an input/output adapter (e.g., OneBot, WebUI).
  PLUGIN_TYPE_ADAPTER = 1;

  // PLUGIN_TYPE_PERSONA is a persona plugin (e.g., L.I.F.E).
  PLUGIN_TYPE_PERSONA = 2;

  // PLUGIN_TYPE_TOOL is a tool plugin (e.g., getmail, search).
  PLUGIN_TYPE_TOOL = 3;

  // PLUGIN_TYPE_SERVICE is a generic service plugin.
  PLUGIN_TYPE_SERVICE = 4;
}

// SettingsField is one declarative form field inside a settings section.
message SettingsField {
  // key is the stable field identifier within the section.
  string key = 1;

  // type is the field kind: "text" | "number" | "bool" | "select".
  string type = 2;

  // label is the human-readable field label.
  string label = 3;

  // default_value is the initial value as a string ("true"/"false" for bool).
  string default_value = 4;

  // options is the allowed values when type == "select".
  repeated string options = 5;

  // help is optional helper text shown under the field.
  string help = 6;
}

// SettingsSection is a settings tab contributed by a plugin.
message SettingsSection {
  // id is the unique section id (also used as the Settings tab id).
  string id = 1;

  // label is the human-readable tab label.
  string label = 2;

  // icon is an icon name for the Settings nav (optional).
  string icon = 3;

  // order controls nav sorting (lower first). Built-ins use 0-100.
  int32 order = 4;

  // description is optional section helper text.
  string description = 5;

  // fields are the declarative form fields for this section.
  repeated SettingsField fields = 6;
}

// TaskState represents the state of an Agent task.
enum TaskState {
  // TASK_STATE_UNSPECIFIED is the default value.
  TASK_STATE_UNSPECIFIED = 0;

  // TASK_STATE_PENDING indicates the task is queued.
  TASK_STATE_PENDING = 1;

  // TASK_STATE_RUNNING indicates the task is being processed.
  TASK_STATE_RUNNING = 2;

  // TASK_STATE_DONE indicates the task completed successfully.
  TASK_STATE_DONE = 3;

  // TASK_STATE_FAILED indicates the task failed.
  TASK_STATE_FAILED = 4;

  // TASK_STATE_CANCELLED indicates the task was cancelled.
  TASK_STATE_CANCELLED = 5;
}
