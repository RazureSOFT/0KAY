syntax = "proto3";

package core.v1;

option go_package = "0kay/gen/core/v1;corev1";
option java_package = "ai.zero.kay.core.v1";
option java_multiple_files = true;
option csharp_namespace = "Zero.Kay.Core.V1";
option objc_class_prefix = "ZKCore";

import "plugin/v1/plugin.proto";

// PluginService is the service that plugins use to register with the Core.
service PluginService {
  // Register registers a plugin with the Core.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Heartbeat sends periodic heartbeats to indicate plugin health.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// CoreService is the internal service that Core provides to plugins.
service CoreService {
  // CallMocr invokes the mocr service for model selection and generation.
  rpc CallMocr(CallMocrRequest) returns (stream CallMocrResponse);

  // UseAgent asynchronously dispatches a task to an Agent.
  rpc UseAgent(UseAgentRequest) returns (UseAgentResponse);

  // CancelAgent cancels a running Agent task.
  rpc CancelAgent(CancelAgentRequest) returns (CancelAgentResponse);

  // ListAgents returns all healthy online Agent plugins.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // RunDirect executes a tool command on an Agent without an LLM loop.
  rpc RunDirect(RunDirectRequest) returns (RunDirectResponse);

  // Egress proxies an outbound HTTP request on behalf of a plugin so all
  // plugin network access flows through Core and is checked against the
  // plugin's declared egress allowlist. Built-in plugins bypass the check.
  rpc Egress(EgressRequest) returns (EgressResponse);

  // ListPluginTools returns the tools contributed by healthy plugins for a
  // consumer scope ("agent" / "life").
  rpc ListPluginTools(ListPluginToolsRequest) returns (ListPluginToolsResponse);

  // CallPluginTool routes a tool call to the owning plugin's ToolService.
  rpc CallPluginTool(CallPluginToolRequest) returns (CallPluginToolResponse);

  // PublishInboundMessage reports one inbound adapter message into Core's
  // message bus. Adapter plugins (L.I.F.E for QQ/OneBot, or a third-party
  // bridge) call this for every message they observe.
  //
  // Two things happen: Core records the caller as the adapter's owner — which
  // is what later lets SendMessage route back to it — and fans the message out
  // to every subscriber whose declared permissions cover it. Requires
  // permissions.messages.publish_adapters to list the adapter.
  rpc PublishInboundMessage(PublishInboundMessageRequest) returns (PublishInboundMessageResponse);

  // SubscribeMessages opens a stream of inbound adapter messages the caller is
  // allowed to read. Delivery is filtered by the caller's declared
  // permissions.messages (read_mode / read_adapters / read_conversations), and
  // the stream ends when the plugin disconnects or is disabled.
  rpc SubscribeMessages(SubscribeMessagesRequest) returns (stream SubscribeMessagesResponse);

  // SendMessage asks Core to deliver an outbound message through an adapter.
  // Core checks permissions.messages.send_adapters, routes the send to the
  // adapter's owning plugin (MessageService.SendMessage) and returns its
  // result.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // ListAdapters reports the adapters the caller may use, with the
  // conversations it may address. A plugin uses this to discover valid
  // adapter_id / conversation values before calling SendMessage.
  rpc ListAdapters(ListAdaptersRequest) returns (ListAdaptersResponse);
}

// RegisterRequest is the request for PluginService.Register.
message RegisterRequest {
  // plugin_info contains metadata about the plugin being registered.
  plugin.v1.PluginInfo plugin_info = 1;

  // capabilities lists the service names this plugin provides.
  repeated string capabilities = 2;

  // address is the gRPC service address where Core can call this plugin
  // back (e.g., "localhost:50054" for Agent, "localhost:50053" for L.I.F.E).
  string address = 3;

  // settings_sections declares UI settings this plugin contributes to the
  // WebUI Settings page (optional).
  repeated plugin.v1.SettingsSection settings_sections = 4;
}

// RegisterResponse is the response for PluginService.Register.
message RegisterResponse {
  // success indicates whether registration was accepted.
  bool success = 1;

  // plugin_id is the unique identifier assigned to this plugin.
  string plugin_id = 2;

  // message contains optional human-readable status.
  string message = 3;

  // service_token is the plugin's per-identity bearer token, issued by Core.
  // The plugin sends it (with its name) on Core HTTP calls and the egress RPC
  // so Core can attribute and authorize the request.
  string service_token = 4;
}

// HeartbeatRequest is the request for PluginService.Heartbeat.
message HeartbeatRequest {
  // plugin_id is the unique identifier of the sending plugin.
  string plugin_id = 1;

  // status is the current health status.
  PluginStatus status = 2;

  // active_tasks is the number of tasks currently being processed.
  int32 active_tasks = 3;

  // host_info describes the host machine running this plugin.
  HostInfo host = 4;
}

// HostInfo describes the machine hosting a plugin.
message HostInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string cpu_model = 4;
  int32 cpu_cores = 5;
  int64 memory_total_bytes = 6;
  int64 memory_available_bytes = 7;
  string workdir = 8;
}

// HeartbeatResponse is the response for PluginService.Heartbeat.
message HeartbeatResponse {
  // ok indicates the Core received the heartbeat.
  bool ok = 1;

  // shutdown_signal indicates the plugin should gracefully shut down.
  bool shutdown_signal = 2;
}

// CallMocrRequest is the request for CoreService.CallMocr.
message CallMocrRequest {
  // request_id is a unique identifier for this call.
  string request_id = 1;

  // caller_id is the plugin ID making the request.
  string caller_id = 2;

  // prompt is the input prompt for the model.
  string prompt = 3;

  // context provides additional context for model selection.
  MocrContext context = 4;

  // stream indicates whether to stream the response.
  bool stream = 5;

  // session_id groups messages into a conversation session.
  string session_id = 6;

  // messages is the full conversation history (oldest first).
  // When empty, Core synthesizes history from its session store.
  repeated ChatMessage messages = 7;

  // model_id optionally pins a specific model (default: mocr selection).
  string model_id = 8;

  // system_prompt is an optional system instruction.
  string system_prompt = 9;
}

// ChatMessage is a single conversation turn.
message ChatMessage {
  // role is "system" | "user" | "assistant".
  string role = 1;

  // content is the message text.
  string content = 2;
}

// CallMocrResponse is the response for CoreService.CallMocr.
message CallMocrResponse {
  // request_id matches the request.
  string request_id = 1;

  // chunk is a piece of the generated text (when streaming).
  string chunk = 2;

  // done indicates the generation is complete.
  bool done = 3;

  // error contains any error that occurred.
  string error = 4;

  // usage contains token usage information.
  TokenUsage usage = 5;
}

// UseAgentRequest is the request for CoreService.UseAgent.
message UseAgentRequest {
  // task_id is the unique identifier for this task.
  string task_id = 1;

  // caller_id is the plugin ID making the request.
  string caller_id = 2;

  // prompt is the task description for the Agent.
  string prompt = 3;

  // agent_type specifies which Agent type to use.
  string agent_type = 4;

  // metadata contains optional key-value pairs for task context.
  map<string, string> metadata = 5;
}

// UseAgentResponse is the response for CoreService.UseAgent.
message UseAgentResponse {
  // accepted indicates the task was accepted for processing.
  bool accepted = 1;

  // task_id is the unique identifier for tracking this task.
  string task_id = 2;

  // message contains optional human-readable status.
  string message = 3;
}

// CancelAgentRequest is the request for CoreService.CancelAgent.
message CancelAgentRequest {
  // task_id is the task to cancel.
  string task_id = 1;

  // caller_id is the plugin ID requesting cancellation.
  string caller_id = 2;
}

// CancelAgentResponse is the response for CoreService.CancelAgent.
message CancelAgentResponse {
  // success indicates whether cancellation was accepted.
  bool success = 1;

  // message contains optional human-readable status.
  string message = 2;
}

// ListAgentsRequest is the request for CoreService.ListAgents.
message ListAgentsRequest {
  // include_unhealthy includes unhealthy agents if true.
  bool include_unhealthy = 1;
}

// ListAgentsResponse is the response for CoreService.ListAgents.
message ListAgentsResponse {
  // agents is the list of registered Agent plugins.
  repeated AgentInfo agents = 1;

  // online_count is the number of healthy (online) agents.
  int32 online_count = 2;
}

// AgentInfo describes a registered Agent plugin.
message AgentInfo {
  // plugin_id is the unique identifier assigned during registration.
  string plugin_id = 1;

  // name is the human-readable plugin name.
  string name = 2;

  // version is the plugin version.
  string version = 3;

  // address is the gRPC callback address of the agent.
  string address = 4;

  // status is the health status.
  PluginStatus status = 5;

  // active_tasks is the number of tasks currently being processed.
  int32 active_tasks = 6;

  // last_heartbeat_age_seconds is how long ago the last heartbeat was received.
  int64 last_heartbeat_age_seconds = 7;

  // host is the host configuration reported by the plugin.
  HostInfo host = 8;
}

// RunDirectRequest is the request for CoreService.RunDirect.
message RunDirectRequest {
  // tool is the tool name (e.g., "shell", "filesystem", "computeruse").
  string tool = 1;

  // args is the tool arguments as JSON.
  string args = 2;

  // session_id is optional correlation id.
  string session_id = 3;
}

// RunDirectResponse is the response for CoreService.RunDirect.
message RunDirectResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}

// EgressRequest is an outbound HTTP request a plugin asks Core to perform.
message EgressRequest {
  // plugin_id is the calling plugin's id (CallerID is filled by Core).
  string plugin_id = 1;

  // method is the HTTP method (GET/POST/...); defaults to GET.
  string method = 2;

  // url is the absolute target URL.
  string url = 3;

  // headers are forwarded request headers.
  map<string, string> headers = 4;

  // body is the request body (optional).
  bytes body = 5;

  // timeout_ms caps the request duration (0 = Core default).
  int32 timeout_ms = 6;
}

// EgressResponse is the result of CoreService.Egress.
message EgressResponse {
  // status is the upstream HTTP status code (0 on transport error).
  int32 status = 1;

  // headers are the upstream response headers.
  map<string, string> headers = 2;

  // body is the upstream response body.
  bytes body = 3;

  // error is set when the request was blocked or failed at the transport layer.
  string error = 4;
}

// ListPluginToolsRequest is the request for CoreService.ListPluginTools.
message ListPluginToolsRequest {
  // scope filters by consumer: "agent", "life" (empty = all).
  string scope = 1;
}

// PluginToolEntry pairs a contributed tool with its owning plugin.
message PluginToolEntry {
  // plugin is the plugin name that owns the tool.
  string plugin = 1;

  // tool is the contributed tool descriptor.
  plugin.v1.PluginTool tool = 2;
}

// ListPluginToolsResponse is the response for CoreService.ListPluginTools.
message ListPluginToolsResponse {
  repeated PluginToolEntry tools = 1;
}

// CallPluginToolRequest is the request for CoreService.CallPluginTool.
message CallPluginToolRequest {
  // tool is the tool name to call.
  string tool = 1;

  // args_json is the JSON-encoded arguments object.
  string args_json = 2;

  // session_id groups the call into a conversation session.
  string session_id = 3;

  // caller_id is the consumer invoking the tool ("agent", "life", ...).
  string caller_id = 4;
}

// CallPluginToolResponse is the response for CoreService.CallPluginTool.
message CallPluginToolResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}

// PublishInboundMessageRequest is the request for
// CoreService.PublishInboundMessage.
message PublishInboundMessageRequest {
  // caller_id is the plugin id reporting the message (Core fills it from the
  // authenticated plugin identity, so a plugin cannot report as another).
  string caller_id = 1;

  // message is the observed adapter message.
  plugin.v1.InboundMessage message = 2;
}

// PublishInboundMessageResponse is the response for
// CoreService.PublishInboundMessage.
message PublishInboundMessageResponse {
  // accepted indicates Core recorded and fanned out the message.
  bool accepted = 1;

  // delivered is how many subscribers received it. Zero is normal — it means
  // nobody declared an interest in this adapter/conversation.
  int32 delivered = 2;

  // error is a human-readable error when accepted is false.
  string error = 3;

  // should_process is the arbitration verdict the publisher must apply: false
  // means a gate plugin vetoed this message, so the publisher (L.I.F.E) must
  // not run its reply pipeline. true covers both "no gate objected and the
  // publisher's own wake rule fired" and "a gate asked for processing the wake
  // rule would have skipped".
  //
  // Core computes it as: any "deny" → false; else any "allow" → true; else the
  // message's own is_wake flag. A publisher that cannot reach Core at all
  // should fall back to its own wake rule rather than treat the silence as a
  // veto.
  bool should_process = 4;

  // decided_by names the gate plugin that produced the deciding verdict, and
  // reason is its explanation. Both empty when every gate abstained — which is
  // also the answer when no gate plugin is installed, and costs no RPC.
  string decided_by = 5;
  string reason = 6;
}

// SubscribeMessagesRequest is the request for CoreService.SubscribeMessages.
message SubscribeMessagesRequest {
  // caller_id is the subscribing plugin id (Core fills it from the
  // authenticated plugin identity).
  string caller_id = 1;

  // replay_last requests that Core deliver the most recent matching message
  // immediately on subscribe, so a plugin that reconnects can catch up. Zero
  // (the default) starts from now.
  int32 replay_last = 2;
}

// SubscribeMessagesResponse is one delivery on the CoreService.SubscribeMessages
// stream. It wraps the message rather than streaming it bare so the RPC keeps
// room to add per-delivery metadata without a breaking change.
message SubscribeMessagesResponse {
  // message is the inbound adapter message.
  plugin.v1.InboundMessage message = 1;

  // subscriber is the plugin id this delivery was addressed to. Echoed so a
  // plugin that multiplexes several subscriptions can tell them apart.
  string subscriber = 2;
}

// SendMessageRequest is the request for CoreService.SendMessage.
message SendMessageRequest {
  // caller_id is the sending plugin id (Core fills it from the authenticated
  // plugin identity).
  string caller_id = 1;

  // adapter_id is the adapter to send through. Empty selects the only adapter
  // the caller may use, and is an error when there is more than one.
  string adapter_id = 2;

  // conversation is the target: "group:<id>" or "private:<id>".
  string conversation = 3;

  // text is the message body.
  string text = 4;

  // media lists attachment references to send alongside the text.
  repeated string media = 5;
}

// SendMessageResponse is the response for CoreService.SendMessage.
message SendMessageResponse {
  bool success = 1;

  // message_id is the adapter's id for the delivered message, when it has one.
  string message_id = 2;

  // error is a human-readable error when success is false.
  string error = 3;
}

// ListAdaptersRequest is the request for CoreService.ListAdapters.
message ListAdaptersRequest {
  // caller_id is the requesting plugin id (Core fills it from the
  // authenticated plugin identity).
  string caller_id = 1;
}

// AdapterInfo describes one adapter instance Core knows about.
message AdapterInfo {
  // adapter_id is the stable instance id.
  string adapter_id = 1;

  // platform is the platform family ("onebot", "bilibili", …).
  string platform = 2;

  // name is the instance's display name.
  string name = 3;

  // owner_plugin is the plugin that reported messages for this adapter and
  // therefore receives its outbound sends.
  string owner_plugin = 4;

  // can_read is true when the caller's declared permissions cover reading
  // this adapter.
  bool can_read = 5;

  // can_send is true when the caller's declared permissions cover sending
  // through this adapter.
  bool can_send = 6;

  // conversations are the conversations the caller may address on this
  // adapter, when the caller may send. Empty when can_send is false.
  repeated ConversationInfo conversations = 7;
}

// ConversationInfo is one addressable conversation on an adapter.
message ConversationInfo {
  // conversation is the addressing key: "group:<id>" or "private:<id>".
  string conversation = 1;

  // kind is "group" or "private".
  string kind = 2;

  // name is the group / peer display name when known.
  string name = 3;
}

// ListAdaptersResponse is the response for CoreService.ListAdapters.
message ListAdaptersResponse {
  repeated AdapterInfo adapters = 1;
}

// MocrContext provides additional context for model selection.
message MocrContext {
  // difficulty_hint suggests the difficulty level (0.0 to 1.0).
  double difficulty_hint = 1;

  // max_tokens is the maximum number of tokens to generate.
  int32 max_tokens = 2;

  // temperature controls randomness (0.0 to 2.0).
  double temperature = 3;

  // cost_budget is the maximum cost in arbitrary units.
  double cost_budget = 4;

  // task_type describes the type of task (e.g., "chat", "code", "analysis").
  string task_type = 5;
}

// TokenUsage contains token usage information.
message TokenUsage {
  // prompt_tokens is the number of tokens in the prompt.
  int32 prompt_tokens = 1;

  // completion_tokens is the number of tokens generated.
  int32 completion_tokens = 2;

  // total_tokens is the total token count.
  int32 total_tokens = 3;
}

// PluginStatus represents the health status of a plugin.
enum PluginStatus {
  // PLUGIN_STATUS_UNSPECIFIED is the default value.
  PLUGIN_STATUS_UNSPECIFIED = 0;

  // PLUGIN_STATUS_HEALTHY indicates the plugin is operating normally.
  PLUGIN_STATUS_HEALTHY = 1;

  // PLUGIN_STATUS_DEGRADED indicates the plugin is partially operational.
  PLUGIN_STATUS_DEGRADED = 2;

  // PLUGIN_STATUS_UNHEALTHY indicates the plugin is not operational.
  PLUGIN_STATUS_UNHEALTHY = 3;
}
