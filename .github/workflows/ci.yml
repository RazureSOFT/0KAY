name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: |
            core/go.sum
            mocr/go.sum
            gen/go/go.sum
      - name: Lint, vet and test core
        working-directory: core
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Lint, vet and test mocr
        working-directory: mocr
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Lint
        working-directory: webui
        run: npm run lint
      - name: Type-check and build
        working-directory: webui
        run: npm run build
      - name: Unit tests
        working-directory: webui
        run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check LIFE and searxng
        run: |
          python -m compileall -q life/src
          python -m py_compile searxng/server.py
