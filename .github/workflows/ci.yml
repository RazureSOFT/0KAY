name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: |
            core/go.sum
            mocr/go.sum
            gen/go/go.sum
      - name: Lint, vet and test core
        working-directory: core
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Lint, vet and test mocr
        working-directory: mocr
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
          go test -race ./...

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Lint
        working-directory: webui
        run: npm run lint
      - name: Type-check and build
        working-directory: webui
        run: npm run build
      - name: Unit tests
        working-directory: webui
        run: npm test

  plugin-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      # core/data/plugin-ui/webui/*.js are committed build outputs; without
      # this check a source change ships as "new src + stale bundle".
      - name: Committed plugin bundles are in sync
        working-directory: webui
        run: |
          npm run build:plugin
          git diff --exit-code ../core/data/plugin-ui/webui/ || {
            echo "::error::core/data/plugin-ui/webui is out of sync — run 'npm run build:plugin' in webui/ and commit"
            exit 1
          }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: life/pyproject.toml
      - name: Install L.I.F.E
        run: |
          python -m pip install --upgrade pip
          pip install -e "./life[dev]"
      - name: Syntax check LIFE
        run: |
          python -m compileall -q life/src
      - name: L.I.F.E unit tests
        working-directory: life
        run: python -m pytest tests -q
      - name: Dependency audit (no known vulnerabilities)
        run: |
          python -m pip install pip-audit
          pip-audit

  # plugin-web 前端面板：依赖审计 + 构建门禁（审计 Q-02）。
  #
  # 注意：agent/mcp/minecraft/pm/deepseek-* 是独立仓库（根 .gitignore 排除、
  # 无 submodule），不会出现在本仓库的 checkout 中，因此它们各自的依赖审计、
  # 类型检查与测试门禁放在各自仓库的 .github/workflows/ci.yml 里。
  plugin-web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: plugin-web/agent
            install: npm ci
            build: npm run build
          - dir: plugin-web/life
            install: npm ci
            build: npm run build
          - dir: plugin-web/minecraft
            install: npm ci
            build: npm run build
          - dir: plugin-web/skillsguishow
            install: npm ci
            build: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: ${{ matrix.dir }}
        env:
          INSTALL: ${{ matrix.install }}
        run: "$INSTALL"
      - name: Audit dependencies (high/critical gate)
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
      - name: Build
        if: matrix.build
        working-directory: ${{ matrix.dir }}
        env:
          BUILD: ${{ matrix.build }}
        run: "$BUILD"

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # breaking-change detection needs the main branch history
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup-only: true
      - name: Lint protobuf
        run: buf lint
      - name: Breaking-change check against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main,subdir=proto'
      # gen/ is committed; regenerate and fail if anyone edits proto without
      # refreshing the three language outputs.
      - name: Generated code is in sync
        run: |
          buf generate
          git diff --exit-code gen/ || {
            echo "::error::gen/ is out of sync with proto/ — run 'buf generate' and commit the result"
            exit 1
          }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A broken COPY (a gitignored file, a moved path) only surfaces when a
      # clean checkout actually builds the image.
      - name: Build core image
        run: docker build -f core/Dockerfile -t 0kay-core-smoke .
      - name: Build webui image
        run: docker build -f webui/Dockerfile -t 0kay-webui-smoke .
