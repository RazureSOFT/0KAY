[package]
name = "okay-devkit"
version = "0.1.0"
edition = "2021"
description = "Tiny client for the 0kay Core HTTP API (plugins, health, settings)"
license = "MIT"
repository = "https://github.com/RazureSOFT/0KAY"
keywords = ["0kay", "devkit", "api", "client"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[[bin]]
name = "discover"
path = "src/bin/discover.rs"
