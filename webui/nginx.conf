server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. proxy_pass below uses a variable so Core's
    # address is re-resolved per request instead of being pinned once at
    # startup (a Core restart would otherwise break the proxy until nginx
    # restarted too).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_upstream core;

    # Attachments, Live2D models and avatars exceed nginx's 1 MB default cap.
    client_max_body_size 100m;

    # Security headers. They are re-declared in the static-assets location
    # below, because a location-level add_header cancels inherited headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The inline <script type="importmap"> in index.html is the only inline
    # script; its hash whitelists exactly that block. If the importmap in
    # webui/index.html ever changes, recompute this sha256.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-wN3WWRWGP7wKZRuoNamhg0C6dKUORsacwGyO+O5xUE4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Core (SSE-friendly: disable buffering)
    location ^~ /api/ {
        proxy_pass http://$core_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location ^~ /live2d/models/ {
        proxy_pass http://$core_upstream:8080;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket connections
    location /ws {
        proxy_pass http://$core_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-wN3WWRWGP7wKZRuoNamhg0C6dKUORsacwGyO+O5xUE4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
