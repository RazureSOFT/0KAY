[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life"
version = "0.1.2"
description = "L.I.F.E - Persona plugin for 0kay AI Agent platform"
requires-python = ">=3.10"
dependencies = [
    # 1.66+: grpc.aio's ServerInterceptor/HandlerCallDetails behaviour that
    # life.grpc.auth relies on; older 1.60 wheels are missing the pieces.
    "grpcio>=1.66.2",
    "protobuf>=4.25.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "websockets>=14.0",
    "tantivy>=0.26.2",
]

[project.optional-dependencies]
# The research toolchain (figures + Word export) is optional so the base
# plugin stays lean; `pip install .[research]` enables it.
research = [
    "matplotlib>=3.7.0",
    "python-docx>=1.1.0",
]
dev = [
    "grpcio-tools>=1.67.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "matplotlib>=3.7.0",
    "python-docx>=1.1.0",
]

[tool.hatch.build.targets.wheel]
# The runtime imports `world.*` from life.worldsim and the shadow updater.
# Ship it alongside `life`; packaging only src/life makes those imports fail
# outside a source checkout even if the development PYTHONPATH is correct.
packages = ["src/life", "world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is unittest.TestCase-based and drives coroutines with an explicit
# `asyncio.run`. Strict mode keeps a bare `async def test_` from being silently
# skipped as a no-op coroutine.
asyncio_mode = "strict"
filterwarnings = [
    # tantivy 0.26 emits these for its deprecated delete API; we call the
    # supported one, so the warning only comes from probing its behaviour.
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "grpc.*",
    "grpc_tools.*",
    "google.protobuf.*",
    "tantivy.*",
    "httpx.*",
    "websockets.*",
    "numpy.*",
    "matplotlib.*",
    "docx.*",
]
ignore_missing_imports = true
