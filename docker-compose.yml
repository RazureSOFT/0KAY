version: '3.8'

services:
  # WebUI - Frontend
  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - core

  # Core - API Gateway & Plugin Registry
  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "127.0.0.1:50051:50051"  # gRPC
      - "127.0.0.1:8080:8080"    # HTTP
    environment:
      - CORE_GRPC_PORT=50051
      - CORE_HTTP_PORT=8080
      - CORE_BIND_HOST=0.0.0.0
      - MOCR_ADDRESS=mocr:50052
      # Trust only the compose network; host/LAN callers need CORE_API_TOKEN or pairing.
      - CORE_TRUSTED_NETWORKS=172.28.0.0/16
      - CORE_API_TOKEN=${CORE_API_TOKEN:?Set a Core API token}
      # Independent enrollment keys bind first-party names to their services.
      - CORE_PLUGIN_REGISTRATION_TOKEN=${CORE_PLUGIN_REGISTRATION_TOKEN:?Set a plugin registration secret}
      - CORE_PLUGIN_TOKEN_LIFE=${LIFE_REGISTRATION_TOKEN:?Set LIFE registration token}
      - CORE_PLUGIN_TOKEN_AGENT=${AGENT_REGISTRATION_TOKEN:?Set Agent registration token}
      - CORE_PLUGIN_TOKEN_MOCR=${MOCR_REGISTRATION_TOKEN:?Set mocr registration token}
      - MOCR_GRPC_TOKEN=${MOCR_GRPC_TOKEN:?Set model service token}
      - TTS_SERVICE_TOKEN=${TTS_SERVICE_TOKEN:-}
    volumes:
      - core-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # mocr - Model Selector
  mocr:
    build:
      context: .
      dockerfile: mocr/Dockerfile
    ports:
      - "127.0.0.1:50052:50052"
    environment:
      - MOCR_GRPC_PORT=50052
      - MOCR_BIND_HOST=0.0.0.0
      - CORE_ADDRESS=core:50051
      - CORE_HTTP_ADDR=http://core:8080
      - MOCR_ADDRESS=mocr:50052
      - CORE_API_TOKEN=${CORE_API_TOKEN:-}
      - CORE_PLUGIN_REGISTRATION_TOKEN=${MOCR_REGISTRATION_TOKEN:?Set mocr registration token}
      - MOCR_GRPC_TOKEN=${MOCR_GRPC_TOKEN:?Set model service token}

  # L.I.F.E - Persona Plugin
  life:
    build:
      context: .
      dockerfile: life/Dockerfile
    ports:
      - "127.0.0.1:50053:50053"
    environment:
      - LIFE_GRPC_PORT=50053
      - LIFE_BIND_HOST=0.0.0.0
      - LIFE_ALLOW_REMOTE_BIND=1
      - LIFE_REQUIRE_AUTH=1
      - MOCR_ADDRESS=mocr:50052
      - CORE_ADDRESS=core:50051
      - CORE_HTTP_ADDR=http://core:8080
      - LIFE_ADDRESS=life:50053
      - LIFE_DATA_DIR=/app/data/life
      - CORE_API_TOKEN=${CORE_API_TOKEN:-}
      - CORE_PLUGIN_REGISTRATION_TOKEN=${LIFE_REGISTRATION_TOKEN:?Set LIFE registration token}
      - MOCR_GRPC_TOKEN=${MOCR_GRPC_TOKEN:?Set model service token}
      - TTS_SERVICE_TOKEN=${TTS_SERVICE_TOKEN:-}
      - MINECRAFT_TOKEN=${MINECRAFT_TOKEN:-}
    volumes:
      - life-data:/app/data/life
    depends_on:
      - core
      - mocr

  # Agent - Task Execution Engine
  # The agent lives in its own repository; fetch it first (bootstrap) and start with
  #   docker compose --profile agent up -d
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "127.0.0.1:50054:50054"
    environment:
      - AGENT_GRPC_PORT=50054
      - AGENT_BIND_HOST=0.0.0.0
      - CORE_ADDRESS=core:50051
      - CORE_HTTP_ADDR=http://core:8080
      - AGENT_ADDRESS=agent:50054
      - AGENT_DATA_DIR=/app/data/agent
      - MOCR_ADDRESS=mocr:50052
      - CORE_API_TOKEN=${CORE_API_TOKEN:-}
      - CORE_PLUGIN_REGISTRATION_TOKEN=${AGENT_REGISTRATION_TOKEN:?Set Agent registration token}
      - MOCR_GRPC_TOKEN=${MOCR_GRPC_TOKEN:?Set model service token}
    depends_on:
      - core
    volumes:
      - agent-data:/app/data/agent

volumes:
  core-data:
  life-data:
  agent-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
